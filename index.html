
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포트폴리오 매니저</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --input-bg: #2a2a2a;
            --accent-color: #3b82f6;
            --text-main: #ffffff;
            --text-sub: #a0a0a0;
            --border-color: #333333;
            --danger-color: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 30px;
            text-align: left;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        header p { color: var(--text-sub); font-size: 0.95rem; }

        /* 컨트롤 영역 */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn-group { display: flex; gap: 8px; }

        .btn {
            background-color: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover { background-color: #333333; }
        .btn-primary { background-color: var(--accent-color); border: none; }
        .btn-primary:hover { background-color: #2563eb; }
        .btn-danger { color: var(--danger-color); border-color: rgba(239, 68, 68, 0.3); }
        .btn-danger:hover { background-color: rgba(239, 68, 68, 0.1); }

        /* 프로젝트 카드 리스트 */
        .project-list {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .project-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 20px;
        }

        .inputs-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input[type="text"], textarea {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 12px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.9rem;
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .input-category { color: var(--accent-color); font-weight: 600; }
        .input-title { font-size: 1.1rem; font-weight: 600; }

        /* 드래그 앤 드롭 영역 */
        .drop-zone {
            border: 1px dashed var(--border-color);
            border-radius: 6px;
            padding: 20px;
            text-align: center;
            background-color: rgba(255, 255, 255, 0.02);
            cursor: pointer;
            margin-top: 12px;
            transition: background 0.2s;
        }

        .drop-zone:hover, .drop-zone.dragover {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: var(--accent-color);
        }

        .drop-zone-text {
            color: var(--text-sub);
            font-size: 0.85rem;
            pointer-events: none;
        }

        /* 이미지 갤러리 */
        .image-gallery {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 12px;
        }

        .img-item {
            position: relative;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .img-item img {
            width: 100%;
            height: auto;
            display: block;
        }

        .img-delete-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            border-radius: 4px;
            width: 26px;
            height: 26px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }

        .img-delete-btn:hover { background: var(--danger-color); }

        .card-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Portfolio Manager</h1>
            <p>작업물과 이미지를 자유롭게 수정하고 관리하세요.</p>
        </header>

        <div class="controls">
            <span id="project-count" style="color: var(--text-sub); font-size: 0.9rem;">총 0개의 프로젝트</span>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="addNewProject()">+ 작업물 추가</button>
                <button class="btn" onclick="saveProjectData()">저장</button>
                <button class="btn" onclick="document.getElementById('loadFileInput').click()">불러오기</button>
                <input type="file" id="loadFileInput" accept=".json" style="display: none;" onchange="loadProjectData(event)">
            </div>
        </div>

        <div id="project-list" class="project-list"></div>
    </div>

    <script>
        let projects = [
            {
                id: 1,
                category: "게임 디자인 / 스토리",
                title: "공포의 술래잡기 - 캐릭터 스토리 & 세계관",
                tags: "스토리보드, 캐릭터설정, 세계관",
                description: "공포의 술래잡기 게임의 메인 캐릭터 스토리 구성 및 배경 연출 디자인 작업물입니다.",
                images: [],
                additional_text: ""
            },
            {
                id: 2,
                category: "원화 / 리뉴얼",
                title: "공포의 술래잡기 - 디자인 수정 & 개선 과정",
                tags: "원화수정, 피드백반영, 디테일개선",
                description: "초기 시안에서 피드백을 수용하여 비주얼 퀄리티와 분위기를 극대화한 수정 프로세스입니다.",
                images: [],
                additional_text: ""
            },
            {
                id: 3,
                category: "캐릭터 디자인 / 패러디",
                title: "마법소녀 마도카 마기카 - 반려견 패러디 캐릭터",
                tags: "팬아트, 반려견패러디, 일러스트",
                description: "마법소녀 마도카 마기카의 세계관과 캐릭터 특징을 반려견 컨셉으로 재해석한 3차 창작 패러디 디자인입니다.",
                images: [],
                additional_text: ""
            }
        ];

        function renderProjects() {
            const listContainer = document.getElementById('project-list');
            listContainer.innerHTML = '';
            document.getElementById('project-count').innerText = `총 ${projects.length}개의 프로젝트`;

            projects.forEach((proj, index) => {
                const card = document.createElement('div');
                card.className = 'project-card';
                card.innerHTML = `
                    <div class="inputs-group">
                        <input type="text" class="input-category" value="${proj.category}" placeholder="카테고리" onchange="updateProject(${index}, 'category', this.value)">
                        <input type="text" class="input-title" value="${proj.title}" placeholder="제목" onchange="updateProject(${index}, 'title', this.value)">
                        <input type="text" value="${proj.tags}" placeholder="태그 (쉼표로 구분)" onchange="updateProject(${index}, 'tags', this.value)">
                        <textarea rows="2" placeholder="작업물 설명" onchange="updateProject(${index}, 'description', this.value)">${proj.description}</textarea>
                        <textarea rows="2" placeholder="추가 상세 내용" onchange="updateProject(${index}, 'additional_text', this.value)">${proj.additional_text}</textarea>
                    </div>

                    <div class="drop-zone" id="drop-zone-${index}"
                         ondragover="handleDragOver(event, ${index})"
                         ondragleave="handleDragLeave(event, ${index})"
                         ondrop="handleDrop(event, ${index})"
                         onclick="triggerFileInput(${index})">
                        <div class="drop-zone-text">이미지를 드래그하여 놓거나 클릭해서 업로드하세요.</div>
                        <input type="file" id="file-input-${index}" multiple accept="image/*" style="display:none" onchange="handleFileSelect(event, ${index})">
                    </div>

                    <div class="image-gallery" id="gallery-${index}">
                        ${proj.images.map((imgSrc, imgIndex) => `
                            <div class="img-item">
                                <button class="img-delete-btn" onclick="deleteImage(${index}, ${imgIndex})">✕</button>
                                <img src="${imgSrc}" alt="작업물 이미지">
                            </div>
                        `).join('')}
                    </div>

                    <div class="card-actions">
                        <button class="btn btn-danger" onclick="deleteProject(${index})">삭제</button>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        function updateProject(index, key, value) {
            projects[index][key] = value;
        }

        function addNewProject() {
            projects.unshift({
                id: Date.now(),
                category: "",
                title: "",
                tags: "",
                description: "",
                images: [],
                additional_text: ""
            });
            renderProjects();
        }

        function deleteProject(index) {
            if (confirm("이 카드를 삭제하시겠습니까?")) {
                projects.splice(index, 1);
                renderProjects();
            }
        }

        function deleteImage(projIndex, imgIndex) {
            projects[projIndex].images.splice(imgIndex, 1);
            renderProjects();
        }

        function handleDragOver(e, index) {
            e.preventDefault();
            document.getElementById(`drop-zone-${index}`).classList.add('dragover');
        }

        function handleDragLeave(e, index) {
            e.preventDefault();
            document.getElementById(`drop-zone-${index}`).classList.remove('dragover');
        }

        function handleDrop(e, index) {
            e.preventDefault();
            document.getElementById(`drop-zone-${index}`).classList.remove('dragover');
            processFiles(e.dataTransfer.files, index);
        }

        function triggerFileInput(index) {
            document.getElementById(`file-input-${index}`).click();
        }

        function handleFileSelect(e, index) {
            processFiles(e.target.files, index);
        }

        function processFiles(files, projIndex) {
            Array.from(files).forEach(file => {
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        projects[projIndex].images.push(e.target.result);
                        renderProjects();
                    };
                    reader.readAsDataURL(file);
                }
            });
        }

        function saveProjectData() {
            let filename = prompt('저장할 파일 이름을 입력하세요:', 'portfolio_data.json');
            if (!filename) return;
            if (!filename.endsWith('.json')) filename += '.json';

            const blob = new Blob([JSON.stringify(projects, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function loadProjectData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const loadedData = JSON.parse(e.target.result);
                    if (Array.isArray(loadedData)) {
                        projects = loadedData.map(item => ({
                            id: item.id || Date.now(),
                            category: item.category || "",
                            title: item.title || "",
                            tags: item.tags || "",
                            description: item.description || "",
                            images: item.images || [],
                            additional_text: item.additional_text || ""
                        }));
                        renderProjects();
                    }
                } catch (error) {
                    alert('파일을 읽는 중 오류가 발생했습니다.');
                }
            };
            reader.readAsText(file);
        }

        renderProjects();
    </script>
</body>
</html>
