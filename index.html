
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인터랙티브 포트폴리오 매니저</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --danger-color: #ef4444;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 30px 15px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #a5b4fc, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        header p { color: var(--text-sub); font-size: 1rem; }

        /* 컨트롤 버튼 그룹 */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            gap: 10px;
            flex-wrap: wrap; /* Added for responsiveness */
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover { background-color: var(--accent-hover); }
        .btn-danger { background-color: #dc2626; }
        .btn-danger:hover { background-color: #b91c1c; }

        /* 프로젝트 리스트 */
        .project-list {
            display: flex;
            flex-direction: column;
            gap: 35px;
        }

        .project-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            padding: 24px;
            position: relative;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .card-header-inputs {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"], textarea {
            width: 100%;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95rem;
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .input-category { font-weight: 600; color: var(--accent-color); font-size: 0.85rem; }
        .input-title { font-size: 1.3rem; font-weight: 700; }

        /* 드래그 앤 드롭 영역 */
        .drop-zone {
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            background-color: rgba(15, 23, 42, 0.5);
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 15px;
        }

        .drop-zone.dragover {
            border-color: var(--accent-color);
            background-color: rgba(99, 102, 241, 0.1);
        }

        .drop-zone-text {
            color: var(--text-sub);
            font-size: 0.95rem;
            pointer-events: none;
        }

        .drop-zone-text b { color: var(--accent-color); }

        /* 이미지 갤러리 */
        .image-gallery {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 15px;
        }

        .img-item {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            background-color: #000;
        }

        .img-item img {
            width: 100%;
            height: auto;
            display: block;
        }

        .img-delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .img-delete-btn:hover { background: var(--danger-color); }

        .card-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎨 DESIGN PORTFOLIO</h1>
            <p>드래그 앤 드롭으로 작업물과 이미지를 자유롭게 관리하세요.</p>
        </header>

        <div class="controls">
            <span id="project-count" style="color: var(--text-sub);">총 3개의 프로젝트</span>
            <div>
                <button class="btn" onclick="addNewProject()">➕ 새 작업물 추가하기</button>
                <button class="btn" onclick="saveProjectData()">💾 데이터 저장</button>
                <button class="btn" onclick="document.getElementById('loadFileInput').click()">📂 데이터 불러오기</button>
                <input type="file" id="loadFileInput" accept=".json" style="display: none;" onchange="loadProjectData(event)">
            </div>
        </div>

        <div id="project-list" class="project-list">
            <!-- 동적으로 프로젝트 카드가 생성됩니다 -->
        </div>
    </div>

    <script>
        // 초기 작업물 데이터
        let projects = [
            {
                id: 1,
                category: "게임 디자인 / 스토리",
                title: "공포의 술래잡기 - 캐릭터 스토리 & 세계관",
                tags: "스토리보드, 캐릭터설정, 세계관",
                description: "공포의 술래잡기 게임의 메인 캐릭터 스토리 구성 및 배경 연출 디자인 작업물입니다.",
                images: [],
                additional_text: ""
            },
            {
                id: 2,
                category: "원화 / 리뉴얼",
                title: "공포의 술래잡기 - 디자인 수정 & 개선 과정",
                tags: "원화수정, 피드백반영, 디테일개선",
                description: "초기 시안에서 피드백을 수용하여 비주얼 퀄리티와 분위기를 극대화한 수정 프로세스입니다.",
                images: [],
                additional_text: ""
            },
            {
                id: 3,
                category: "캐릭터 디자인 / 패러디",
                title: "마법소녀 마도카 마기카 - 반려견 패러디 캐릭터",
                tags: "팬아트, 반려견패러디, 일러스트",
                description: "마법소녀 마도카 마기카의 세계관과 캐릭터 특징을 반려견 컨셉으로 재해석한 3차 창작 패러디 디자인입니다.",
                images: [],
                additional_text: ""
            }
        ];

        function renderProjects() {
            const listContainer = document.getElementById('project-list');
            listContainer.innerHTML = '';
            document.getElementById('project-count').innerText = `총 ${projects.length}개의 프로젝트`;

            projects.forEach((proj, index) => {
                const card = document.createElement('div');
                card.className = 'project-card';
                card.innerHTML = `
                    <div class="card-header-inputs">
                        <input type="text" class="input-category" value="${proj.category}" placeholder="카테고리 (예: 일러스트/3D)" onchange="updateProject(${index}, 'category', this.value)">
                        <input type="text" class="input-title" value="${proj.title}" placeholder="작업물 제목" onchange="updateProject(${index}, 'title', this.value)">
                        <input type="text" value="${proj.tags}" placeholder="태그 (쉼표로 구분)" onchange="updateProject(${index}, 'tags', this.value)">
                        <textarea rows="2" placeholder="작업물에 대한 설명을 입력하세요" onchange="updateProject(${index}, 'description', this.value)">${proj.description}</textarea>
                        <textarea rows="2" placeholder="추가 내용 (예: 작업 의도, 사용 기술)" onchange="updateProject(${index}, 'additional_text', this.value)">${proj.additional_text}</textarea>
                    </div>

                    <!-- 드래그 앤 드롭 영역 -->
                    <div class="drop-zone" id="drop-zone-${index}"
                         ondragover="handleDragOver(event, ${index})"
                         ondragleave="handleDragLeave(event, ${index})"
                         ondrop="handleDrop(event, ${index})"
                         onclick="triggerFileInput(${index})">
                        <div class="drop-zone-text">
                            📁 <b>이미지를 이곳에 드래그 앤 드롭</b> 하거나 클릭하여 업로드하세요.
                        </div>
                        <input type="file" id="file-input-${index}" multiple accept="image/*" style="display:none" onchange="handleFileSelect(event, ${index})">
                    </div>

                    <!-- 업로드된 이미지 리스트 -->
                    <div class="image-gallery" id="gallery-${index}">
                        ${proj.images.map((imgSrc, imgIndex) => `
                            <div class="img-item">
                                <button class="img-delete-btn" onclick="deleteImage(${index}, ${imgIndex})">✕</button>
                                <img src="${imgSrc}" alt="작업물 이미지">
                            </div>
                        `).join('')}
                    </div>

                    <div class="card-actions">
                        <button class="btn btn-danger" onclick="deleteProject(${index})">🗑️ 카드 삭제</button>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        // 데이터 업데이트
        function updateProject(index, key, value) {
            projects[index][key] = value;
        }

        // 프로젝트 추가
        function addNewProject() {
            projects.unshift({
                id: Date.now(),
                category: "새 카테고리",
                title: "새 작업물 제목",
                tags: "태그1, 태그2",
                description: "작업물에 대한 설명을 입력해 주세요.",
                images: [],
                additional_text: ""
            });
            renderProjects();
        }

        // 프로젝트 삭제
        function deleteProject(index) {
            if (confirm("이 작업물 카드를 삭제하시겠습니까?")) {
                projects.splice(index, 1);
                renderProjects();
            }
        }

        // 이미지 삭제
        function deleteImage(projIndex, imgIndex) {
            projects[projIndex].images.splice(imgIndex, 1);
            renderProjects();
        }

        // 파일 드래그 앤 드롭 처리
        function handleDragOver(e, index) {
            e.preventDefault();
            document.getElementById(`drop-zone-${index}`).classList.add('dragover');
        }

        function handleDragLeave(e, index) {
            e.preventDefault();
            document.getElementById(`drop-zone-${index}`).classList.remove('dragover');
        }

        function handleDrop(e, index) {
            e.preventDefault();
            document.getElementById(`drop-zone-${index}`).classList.remove('dragover');
            const files = e.dataTransfer.files;
            processFiles(files, index);
        }

        function triggerFileInput(index) {
            document.getElementById(`file-input-${index}`).click();
        }

        function handleFileSelect(e, index) {
            const files = e.target.files;
            processFiles(files, index);
        }

        // 이미지 읽기 (Base64 변환)
        function processFiles(files, projIndex) {
            Array.from(files).forEach(file => {
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        projects[projIndex].images.push(e.target.result);
                        renderProjects();
                    };
                    reader.readAsDataURL(file);
                }
            });
        }

        // 프로젝트 데이터 저장 함수
        function saveProjectData() {
            let filename = prompt('저장할 파일 이름을 입력하세요 (예: my_portfolio.json):', 'portfolio_data.json');
            if (filename === null) { // User cancelled the prompt
                return;
            }
            if (!filename.endsWith('.json')) {
                filename += '.json';
            }

            const dataStr = JSON.stringify(projects, null, 2); // Pretty print JSON
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a); // Append to body to make it clickable
            a.click();
            document.body.removeChild(a); // Clean up
            URL.revokeObjectURL(url); // Release object URL
        }

        // 프로젝트 데이터 불러오기 함수
        function loadProjectData(event) {
            const file = event.target.files[0];
            if (!file) {
                return;
            }
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const loadedData = JSON.parse(e.target.result);
                    if (Array.isArray(loadedData) && loadedData.every(item => 'id' in item && 'category' in item && 'title' in item)) {
                        // Ensure new fields are initialized if not present in loaded data
                        const normalizedData = loadedData.map(item => ({
                            id: item.id,
                            category: item.category || "",
                            title: item.title || "",
                            tags: item.tags || "",
                            description: item.description || "",
                            images: item.images || [],
                            additional_text: item.additional_text || "" // Initialize new field
                        }));
                        projects = normalizedData;
                        renderProjects();
                        alert('데이터를 성공적으로 불러왔습니다!');
                    } else {
                        alert('유효하지 않은 JSON 파일 형식입니다.');
                    }
                } catch (error) {
                    alert('파일을 파싱하는 중 오류가 발생했습니다: ' + error.message);
                }
            };
            reader.readAsText(file);
        }

        // 초기 실행
        renderProjects();
    </script>
</body>
</html>
