<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0d0e;
            --card-bg: #161618;
            --text-main: #f1f1f3;
            --text-sub: #8e8e93;
            --border-color: #242428;
            --accent-color: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
        }

        /* 1. 상단 네비게이션 (왼쪽 로고, 오른쪽 카테고리) */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            background-color: rgba(13, 13, 14, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-main);
            text-decoration: none;
        }

        .category-menu {
            display: flex;
            gap: 24px;
            list-style: none;
        }

        .category-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: color 0.2s ease;
            padding: 8px 0;
            position: relative;
        }

        .category-btn:hover, .category-btn.active {
            color: var(--accent-color);
        }

        .category-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--accent-color);
        }

        /* 메인 컨테이너 */
        main {
            max-width: 1200px;
            margin: 110px auto 60px;
            padding: 0 20px;
        }

        /* 2. 작업물 그리드 레이아웃 */
        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: transform 0.3s ease, border-color 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: #3d3d42;
        }

        .card-img-wrapper {
            width: 100%;
            height: 240px;
            background-color: #202024;
            overflow: hidden;
            position: relative;
        }

        .card-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .card:hover .card-img-wrapper img {
            transform: scale(1.04);
        }

        .card-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .card-tag {
            font-size: 0.8rem;
            color: var(--text-sub);
            font-weight: 500;
            text-transform: uppercase;
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .card-desc {
            font-size: 0.9rem;
            color: var(--text-sub);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card.hide {
            display: none;
        }

        /* 3. 모달 (상세 보기 팝업) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.open { display: flex; }

        .modal-content {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            max-width: 700px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 30px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .close-btn:hover { color: var(--text-main); }

        .modal-title { font-size: 1.5rem; margin-bottom: 8px; }
        .modal-category { color: var(--text-sub); font-size: 0.9rem; margin-bottom: 20px; }
        .modal-img { width: 100%; border-radius: 8px; margin-bottom: 20px; }
        .modal-desc { line-height: 1.7; color: #d1d1d6; }

        /* 반응형 */
        @media (max-width: 768px) {
            nav { padding: 0 20px; }
            .category-menu { gap: 12px; }
            .category-btn { font-size: 0.85rem; }
            .portfolio-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- 상단 네비게이션 -->
    <nav>
        <!-- 왼쪽: 로고 -->
        <a href="#" class="logo">PORTFOLIO.</a>

        <!-- 오른쪽: 3가지 카테고리 -->
        <ul class="category-menu">
            <li><button class="category-btn active" onclick="filterCategory('all')">ALL</button></li>
            <li><button class="category-btn" onclick="filterCategory('office')">사무디자인·로고</button></li>
            <li><button class="category-btn" onclick="filterCategory('web')">웹디자인</button></li>
            <li><button class="category-btn" onclick="filterCategory('game')">게임·애니 (2D/3D)</button></li>
        </ul>
    </nav>

    <!-- 메인 콘텐츠 영역 -->
    <main>
        <div class="portfolio-grid" id="portfolio-grid">
            <!-- 자바스크립트로 동적 카드 생성 -->
        </div>
    </main>

    <!-- 상세보기 모달 -->
    <div class="modal" id="modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <h2 class="modal-title" id="modal-title"></h2>
            <p class="modal-category" id="modal-category"></p>
            <img src="" alt="" class="modal-img" id="modal-img">
            <p class="modal-desc" id="modal-desc"></p>
        </div>
    </div>

    <script>
        // 포트폴리오 데이터
        const portfolioData = [
            /* 1. 사무디자인 - 로고 */
            {
                id: 1,
                category: 'office',
                categoryLabel: '사무디자인 · 로고',
                title: '모던 브랜드 CI / 로고 디자인',
                desc: '기업 아이덴티티를 명확하게 전달하기 위한 미니멀 세리프 로고 및 사무용 서식 디자인 패키지입니다.',
                image: 'https://picsum.photos/700/500?random=10'
            },
            {
                id: 2,
                category: 'office',
                categoryLabel: '사무디자인 · 로고',
                title: '스타트업 리브랜딩 & 브로슈어',
                desc: '테크 스타트업의 신규 로고 및 사원증, 명함, 브랜딩 문서 가이드라인을 작업했습니다.',
                image: 'https://picsum.photos/700/500?random=11'
            },

            /* 2. 웹디자인 */
            {
                id: 3,
                category: 'web',
                categoryLabel: '웹디자인',
                title: '이커머스 브랜드 웹사이트',
                desc: '사용자 경험(UX) 최적화 및 간결한 UI 레이아웃을 통해 구매 전환율을 높인 반응형 웹 인터페이스 디자인입니다.',
                image: 'https://picsum.photos/700/500?random=20'
            },
            {
                id: 4,
                category: 'web',
                categoryLabel: '웹디자인',
                title: 'SaaS 대시보드 플랫폼 UI',
                desc: '데이터 시각화를 극대화하고 다크모드 환경에 맞춰 가독성을 확보한 B2B 솔루션 대시보드입니다.',
                image: 'https://picsum.photos/700/500?random=21'
            },

            /* 3. 게임 및 애니메이션 디자인 (2D/3D 캐릭터, 무기, 소품) */
            {
                id: 5,
                category: 'game',
                categoryLabel: '게임 · 애니메이션 디자인',
                title: 'SF 판타지 3D 캐릭터 모델링',
                desc: 'ZBrush 및 blender를 활용해 고품질 텍스처링과 리깅까지 마친 게임용 메인 캐릭터 모델링입니다.',
                image: 'https://picsum.photos/700/500?random=30'
            },
            {
                id: 6,
                category: 'game',
                categoryLabel: '게임 · 애니메이션 디자인',
                title: '2D 원화 - 판타지 무기 & 소품 컨셉아트',
                desc: '게임 세계를 구성하는 전설 등급 무기 및 소품의 2D 컨셉 시안과 디테일 시트입니다.',
                image: 'https://picsum.photos/700/500?random=31'
            },
            {
                id: 7,
                category: 'game',
                categoryLabel: '게임 · 애니메이션 디자인',
                title: '애니메이션용 2D 캐주얼 캐릭터 시트',
                desc: '애니메이션 원화 작업용 턴어라운드 표현과 다양한 감정 표현 표정이 담긴 캐릭터 디자인입니다.',
                image: 'https://picsum.photos/700/500?random=32'
            }
        ];

        // 렌더링 함수
        function renderPortfolio() {
            const grid = document.getElementById('portfolio-grid');
            grid.innerHTML = portfolioData.map(item => `
                <div class="card" data-category="${item.category}" onclick="openModal(${item.id})">
                    <div class="card-img-wrapper">
                        <img src="${item.image}" alt="${item.title}">
                    </div>
                    <div class="card-info">
                        <span class="card-tag">${item.categoryLabel}</span>
                        <h3 class="card-title">${item.title}</h3>
                        <p class="card-desc">${item.desc}</p>
                    </div>
                </div>
            `).join('');
        }

        // 카테고리 필터링
        function filterCategory(category) {
            // 버튼 활성화 스타일 변경
            const buttons = document.querySelectorAll('.category-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // 카테고리 카드 필터링
            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                if (category === 'all' || card.dataset.category === category) {
                    card.classList.remove('hide');
                } else {
                    card.classList.add('hide');
                }
            });
        }

        // 모달 열기
        function openModal(id) {
            const item = portfolioData.find(p => p.id === id);
            if (!item) return;

            document.getElementById('modal-title').innerText = item.title;
            document.getElementById('modal-category').innerText = item.categoryLabel;
            document.getElementById('modal-img').src = item.image;
            document.getElementById('modal-desc').innerText = item.desc;

            document.getElementById('modal').classList.add('open');
        }

        // 모달 닫기
        function closeModal(event) {
            document.getElementById('modal').classList.remove('open');
        }

        // 초기 실행
        renderPortfolio();
    </script>
</body>
</html>
